<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Doraemon Adventure Game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="startMenu">
    <h1>DORAEMON<br>ADVENTURE<br>GAME</h1>
    <p class="tagline">Explore. Collect. Play. Have Fun!</p>
    <button id="playBtn">▶ PLAY</button>
    <div class="menuBtns">
      <button class="subBtn">🗺️ ADVENTURES</button>
      <button class="subBtn">🎒 GADGETS</button>
      <button class="subBtn">🏆 ACHIEVEMENTS</button>
    </div>
  </div>

  <div id="gameContainer" style="display:none;">
    <canvas id="gameCanvas"></canvas>
    
    <div id="hud">
      <div class="hudLeft">
        <div id="coins">💰 0</div>
      </div>
      <div class="hudRight">
        <div id="stars">⭐ 0</div>
        <div id="lives">❤️❤️❤️</div>
      </div>
    </div>

    <div id="mobileControls">
      <button id="leftBtn">⬅️</button>
      <button id="jumpBtn">⬆️</button>
      <button id="rightBtn">➡️</button>
    </div>

    <div id="gameOver" style="display:none;">
      <h2>GAME OVER</h2>
      <p id="finalScore">Score: 0</p>
      <button id="restartBtn">🔄 PLAY AGAIN</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
