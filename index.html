<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Doraemon Adventure Game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- START MENU - ALTA POSTER JAISE -->
  <div id="startMenu">
    <h1>DORAEMON<br>ADVENTURE<br>GAME</h1>
    <p class="tagline">Explore. Collect. Play. Have Fun!</p>
    <button id="playBtn">▶ PLAY</button>
    <div class="menuBtns">
      <button class="subBtn">🗺️ ADVENTURES</button>
      <button class="subBtn">🎒 GADGETS</button>
      <button class="subBtn">🏆 ACHIEVEMENTS</button>
    </div>
  </div>

  <!-- GAME -->
  <div id="gameContainer" style="display:none;">
    <canvas id="gameCanvas" width="800" height="400"></canvas>
    
    <!-- TOP HUD - ALTA wali image jaisa -->
    <div id="hud">
      <div class="hudLeft">
        <div id="coins">💰 78</div>
      </div>
      <div class="hudRight">
        <div id="stars">⭐ 1250</div>
        <div id="settings">⚙️</div>
      </div>
    </div>

    <!-- MOBILE CONTROLS -->
    <div id="mobileControls">
      <button id="leftBtn">⬅️</button>
      <button id="jumpBtn">⬆️</button>
      <button id="rightBtn">➡️</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
