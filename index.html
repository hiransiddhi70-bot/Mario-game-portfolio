<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0, user-scalable=no">

<title>DORAEMON GAME</title>

<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="menu">
    <h1>DORAEMON<br>GAME</h1>

    <button onclick="startGame()">
        ▶ START
    </button>

    <p>Super Mario Style Doraemon Adventure</p>
</div>

<div id="game">

    <canvas id="canvas"></canvas>

    <div id="hud">

        <div class="hud-box">
            💰 <span id="coins">0</span>
        </div>

        <div class="hud-box">
            ⭐ <span id="score">0</span>
        </div>

        <div class="hud-box">
            ❤️ <span id="lives">3</span>
        </div>

    </div>

    <div id="debug">
        DEBUG
    </div>

    <div id="controls">

        <div class="dpad">

            <button id="leftBtn">
                ⬅️
            </button>

            <button id="rightBtn">
                ➡️
            </button>

        </div>

        <button id="jumpBtn">
            ⬆️
        </button>

    </div>

</div>

<script src="game.js"></script>

</body>
</html>
